name: Build And Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure Conan and Inno Setup
        shell: pwsh
        run: |
          python -m pip install 'conan>=2.28,<3'
          conan profile detect --force
          choco install innosetup -y

      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package-installer.ps1

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Item ./artifacts/publish/win-x64/ManualDoubleSidedPrinter.exe).VersionInfo.ProductVersion
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_id }}
          name: MDSPrinter v${{ steps.version.outputs.value }} (${{ github.sha }})
          generate_release_notes: true
          files: |
            artifacts/installer/*.exe
            artifacts/installer/*.zip
