name: Build And Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build Installer
        shell: pwsh
        run: ./scripts/package-installer.ps1

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./ManualDoubleSidedPrinter.csproj
          $version = $xml.Project.PropertyGroup.Version
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create release archive
        shell: pwsh
        run: |
          $zipName = "ManualDoubleSidedPrinter-win-x64-v${{ steps.version.outputs.value }}.zip"
          Compress-Archive -Path ./artifacts/publish/win-x64/* -DestinationPath "./artifacts/installer/$zipName" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_id }}
          name: Auto Release v${{ steps.version.outputs.value }} (${{ github.sha }})
          generate_release_notes: true
          files: |
            artifacts/installer/*.exe
            artifacts/installer/*.zip
